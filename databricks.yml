bundle:
  name: doc-analyzer

include:
  - resources/*.yml

artifacts:
  doc_analyzer:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for this target
  landing_path:
    description: abfss:// path of the ADLS landing container
  llm_endpoint:
    description: Model Serving endpoint name for the answer model
  embedding_endpoint:
    description: Model Serving endpoint name for embeddings
    default: databricks-bge-large-en
  spark_version:
    description: Databricks Runtime of the job clusters
    default: 16.4.x-scala2.12
  node_type:
    description: VM size of the single-node job clusters
    default: Standard_D4ds_v5

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604740705070.10.azuredatabricks.net
    variables:
      catalog: doc_analyzer_dev
      landing_path: abfss://landing@docanalyzer26247.dfs.core.windows.net/uploads/
      llm_endpoint: databricks-claude-sonnet-5-5

  staging:
    workspace:
      host: https://<workspace>.azuredatabricks.net  # TODO
    variables:
      catalog: doc_analyzer_staging
      landing_path: abfss://landing@<storageaccount>.dfs.core.windows.net/uploads/  # TODO
      llm_endpoint: <llm-endpoint>  # TODO

  prod:
    mode: production
    workspace:
      host: https://<workspace>.azuredatabricks.net  # TODO
    variables:
      catalog: doc_analyzer_prod
      landing_path: abfss://landing@<storageaccount>.dfs.core.windows.net/uploads/  # TODO
      llm_endpoint: <llm-endpoint>  # TODO
