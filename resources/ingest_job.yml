# Workflow: bronze → silver → gold → index sync
resources:
  jobs:
    ingest_job:
      name: doc-analyzer-ingest-${bundle.target}
      # TODO: schedule / file-arrival trigger, job cluster or serverless config
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: landing_path
          default: ${var.landing_path}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_ingest_bronze.py
        - task_key: silver_gold
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_build_silver_gold.py
        - task_key: sync_index
          depends_on:
            - task_key: silver_gold
          notebook_task:
            notebook_path: ../notebooks/03_sync_index.py
